version: '3.8'

services:
  # -------------------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gdg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdg_user
      POSTGRES_PASSWORD: gdg_secure_password_2026
      POSTGRES_DB: gdg_events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdg_user -d gdg_events_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Express + Prisma Backend API Service
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdg-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://gdg_user:gdg_secure_password_2026@postgres:5432/gdg_events_db?schema=public
      JWT_SECRET: super_secure_jwt_production_secret_gdg_club_2026!
      JWT_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"

  # -------------------------------------------------------------------------
  # React + Vite + Nginx Frontend Service
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: gdg-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
